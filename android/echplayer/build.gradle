plugins {
    alias(libs.plugins.android.library)
}

// 候选 ABI 列表。armeabi-v7a 已预留，补齐对应 FFmpeg so 后会自动进入打包。
def candidateNativeAbis = ['arm64-v8a', 'armeabi-v7a']
// 播放器依赖的 FFmpeg 动态库，只有全部存在时才启用对应 ABI。
def requiredFfmpegLibraries = ['avcodec', 'avformat', 'avutil', 'swresample', 'swscale']
// 当前真实可打包的 ABI，避免缺少 so 时 CMake 误编译失败。
def enabledNativeAbis = candidateNativeAbis.findAll { abiName ->
    requiredFfmpegLibraries.every { libraryName ->
        file("src/main/jniLibs/${abiName}/lib${libraryName}.so").exists()
    }
}

if (enabledNativeAbis.isEmpty()) {
    throw new GradleException("echplayer 至少需要一组完整 FFmpeg so 才能构建")
}

android {
    namespace 'com.echplay.player'
    compileSdk 36

    defaultConfig {
        minSdk 28
        versionName "1.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        ndk {
            enabledNativeAbis.each { abiName ->
                abiFilters abiName
            }
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
